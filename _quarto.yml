project:
  type: website
  render:
    - "*.qmd"
    - "!*.rmd"
  output-dir: docs
  resources:
   - "Figures/"

bibliography:
  - "Refs/book.bib"
  - "Refs/packages.bib"
  - "Refs/MyLibrary.bib"

website:
  site-url: https://yeonsoon.github.io/research-methods-and-stats-book
  repo-url: https://github.com/yeonsoon/research-methods-and-stats-book/
  repo-branch: master
  repo-actions: [edit]
  # google-analytics: ""
  title: "Research Methods and Statistics"
  sidebar:
    style: "floating"
    search: true
    contents:
      - index.qmd
      - section: "Research Methods"
        contents:
          - 01-psych-science.qmd
          - 02-research-questions-and-claims.qmd
      - section: "Statistics"
        contents:
          -  02-stats-test.qmd
          -  02-stats-test-copy.qmd
      - section: "Lab"
        contents:
          - lab02-reliability-validity.qmd
          - lab03-eda.qmd
    # logo: ResearchMethods.png

format:
  html:
    theme: ally
    toc: true
    toc-depth: 4
    number-sections: true
    number-depth: 3
    format:
    html-math-method:
      method: mathjax
      url: https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js
  epub: default
  docx: default

editor: source

