project:
  type: website
  render:
    - "*.qmd"
    - "!*.rmd"
  output-dir: docs
  resources:
   - "Figures/"

bibliography:
  - "Refs/book.bib"
  - "Refs/packages.bib"
  - "Refs/MyLibrary.bib"

website:
  site-url: https://yeonsoon.github.io/research-methods-and-stats-book
  repo-url: https://github.com/yeonsoon/research-methods-and-stats-book/
  # google-analytics: ""
  title: "Research Methods and Statistics"
  sidebar:
    style: "floating"
    search: true
    contents:
      - index.qmd
      - section: "Unit 1. The Foundations of Psychology Research"
        contents:
          - 01-psych-science.qmd
          - 02-research-questions-and-claims.qmd
          - 03-measurement.qmd
          - 04-visualizing-and-describing-data.qmd
      - section: "Unit 2. Introduction to Inferential Statistics"
        contents:
          - 05-hypothesis-testing.qmd
      - section: "Lab"
        contents:
          - lab01-r-basics.qmd
          - lab02-reliability.qmd
          - lab03-eda.qmd
      - section: "Appendix"
        contents:
          - appendix-apa.qmd
          - appendix-stats-decisions.qmd
          - appendix-stats-overview.qmd
          - appendix-z-scoring.qmd
          - appendix-z-dist.qmd
          - appendix-t-dist.qmd


format:
  html:
    theme: ally
    toc: true
    toc-depth: 5
    number-sections: true
    number-depth: 5
    html-math-method:
      method: mathjax
      url: https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js
  epub: default
  docx: default

editor: source

